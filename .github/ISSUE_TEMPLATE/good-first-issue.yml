name: I'd like to help
description: New here? Pick something to work on — no experience required.
title: "I'd like to help with: "
labels: ["good-first-issue", "help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        👋 Welcome — we're glad you're here.

        You do **not** need to be a programmer, and you do **not** need to have contributed to an open-source project before. A lot of the most useful work on LQ.AI is writing, reviewing, and explaining things — and we'll help you with the rest.

        If you've found something on the [good first issues](../docs/contribute/good-first-issues.md) list, name it below. If you haven't, that's fine too — just tell us what you'd like to help with, or what you'd want to learn. There are no wrong answers here.

  - type: textarea
    id: what
    attributes:
      label: What would you like to help with?
      description: A list item, an idea, or just "I'm not sure yet — here's what interests me." Whatever you've got.
      placeholder: e.g., I'd like to help improve the setup guide — I tried installing it and got stuck, so I think I can make it clearer.
    validations:
      required: true

  - type: checkboxes
    id: new
    attributes:
      label: Anything we should know?
      options:
        - label: This is my first time contributing to a project like this, and a bit of guidance would help.
        - label: I'd like a maintainer to check in with me before I start.
